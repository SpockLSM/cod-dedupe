ShortDescription: "Keep Call of Duty installed through the Xbox app, Steam and Battle.net while storing the game data once"
Description: "Finds your Call of Duty installs from the Xbox app, Steam and Battle.net and turns byte-identical game data files into NTFS hard links, so three installs take the space of one. Every file is compared byte by byte first; the main store is never modified; a share can be undone per store. Measures what is shared, notices files an update patched in place, and can run from a scheduled task after updates."
